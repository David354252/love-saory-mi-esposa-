// Sonido al abrir el mensaje: si el cliente sube su propio audio se reproduce
// ese; si lo deja vacio (default de fabrica) suena una campanita generada por
// codigo (sin necesidad de ningun archivo), un acorde corto tipo "ting".
const musicaMensaje=(CONFIG.musicaMensaje||DEFAULTS.musicaMensaje||'').trim();
let letterAudio=null,letterAC=null;
if(musicaMensaje){letterAudio=new Audio(musicaMensaje);letterAudio.volume=.85;}
function reproducirCampanita(){
  try{
    letterAC=letterAC||new (window.AudioContext||window.webkitAudioContext)();
    if(letterAC.state==='suspended')letterAC.resume();
    const t=letterAC.currentTime;
    [783.99,987.77,1174.66].forEach((f,i)=>{
      const o=letterAC.createOscillator(),g=letterAC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*.08);
      g.gain.exponentialRampToValueAtTime(.09,t+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.9);
      o.connect(g).connect(letterAC.destination);
      o.start(t+i*.08);o.stop(t+i*.08+.95);
    });
  }catch(e){}
}
function openLetter(){letterOverlay.classList.add('visible');if(letterAudio){letterAudio.currentTime=0;letterAudio.play().catch(()=>{});}else{reproducirCampanita();}}
function closeLetter(){letterOverlay.classList.remove('visible');}
letterBtn.addEventListener('click',openLetter);

const extraConstellations = new THREE.Group();

function createExtraConstellation(points, connections, position, scale = 1) {
    const group = new THREE.Group();

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(points.flat(), 3)
    );

    const stars = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({
            color: 0xf0ddff,
            size: 4.5,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    const glow = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({
            color: 0xa855f7,
            size: 12,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        })
    );

    const linePositions = [];

    connections.forEach(([a, b]) => {
        linePositions.push(...points[a], ...points[b]);
    });

    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(linePositions, 3)
    );

    const lines = new THREE.LineSegments(
        lineGeometry,
        new THREE.LineBasicMaterial({
            color: 0xb388ff,
            transparent: true,
            opacity: 0.48,
            depthWrite: false
        })
    );

    group.add(lines, stars, glow);
    group.position.set(...position);
    group.scale.setScalar(scale);

    extraConstellations.add(group);
    return group;
}

// Textura de resplandor para las estrellas
function createMeteorGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;

    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);

    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.12, 'rgba(235,210,255,0.95)');
    gradient.addColorStop(0.35, 'rgba(168,85,247,0.5)');
    gradient.addColorStop(1, 'rgba(139,77,240,0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 128, 128);

    return new THREE.CanvasTexture(canvas);
}

// Glow exterior (reducido, para que el anillo se note más)
const GLOW_BASE=181;
function makeGlow(size=768,c1='216,180,255',c2='139,77,240'){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(GLOW_BASE,GLOW_BASE,1);
scene.add(glow);

// Anillo único (antes eran 3 anillos separados con huecos reales entre
// ellos). Sigue siendo un solo disco continuo (42-116, sin huecos), pero
// ahora con textura de franjas finas superpuestas al degradado de base -
// como los anillos de Saturno, que se ven "en capas" por dentro sin
// separarse en piezas distintas.
function ringTexture(size=1024){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const rInner=size*0.205,rOuter=size*0.49;
  // Base: un solo degradado continuo de borde a borde, sin apagarse hacia
  // el borde exterior, para que el anillo se vea denso y solido.
  const grd=g.createRadialGradient(0,0,rInner,0,0,rOuter);
  grd.addColorStop(0.00,'rgba(245,235,255,1)');
  grd.addColorStop(0.30,'rgba(216,180,255,1)');
  grd.addColorStop(0.65,'rgba(155,93,224,0.95)');
  grd.addColorStop(1.00,'rgba(109,40,217,0.85)');
  g.fillStyle=grd;
  g.beginPath();g.arc(0,0,rOuter,0,Math.PI*2);g.arc(0,0,rInner,0,Math.PI*2,true);g.closePath();g.fill();

  // Franjas concentricas finas por encima del degradado base - varian el
  // brillo (mas claras u oscuras), nunca la opacidad hasta 0, asi que no
  // dejan huecos ni se leen como anillos separados, solo como textura.
  const bandCount=26;
  for(let i=0;i<bandCount;i++){
    const r=rInner+(rOuter-rInner)*(i/(bandCount-1));
    const dark=i%3===0;
    g.beginPath();
    g.arc(0,0,r,0,Math.PI*2);
    g.lineWidth=(rOuter-rInner)/bandCount*(0.55+Math.random()*0.35);
    g.strokeStyle=dark?'rgba(55,15,110,0.20)':'rgba(240,225,255,0.16)';
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const ring=new THREE.Mesh(new THREE.RingGeometry(21,58,160),new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:1}));
ring.rotation.x=Math.PI/2;
scene.add(ring);

// ── Mejora: flor de partículas moradas flotando sobre el planeta con anillo ──
// Mismo principio que el holograma de galaxia-placas-dia-novio (rosa de 5
// pétalos, r = R·|cos(2.5·θ)|, por rechazo dentro del cuadrado envolvente -
// da una densidad pareja en vez de amontonarse en el centro), pero aquí es
// una sola forma fija flotando arriba del anillo, no un morph entre dos
// formas. Billboard: cada frame mira a la cámara, para que la silueta de
// flor se lea bien gire la cámara hacia donde gire el usuario.
// Más grande (R 34->74, más del doble) y más detallada: el doble de densidad
// de partículas del pétalo (900->2400) más una segunda capa de "destellos"
// finos por encima (sparkleGeo), más chicos y más brillantes, que le dan
// una textura de brillo extra que una sola capa pareja no lograba.
const FLOWER_PARTICLES=2400,FLOWER_R=74;
const flowerPositions=new Float32Array(FLOWER_PARTICLES*3);
const flowerColors=new Float32Array(FLOWER_PARTICLES*3);
const flowerCenterColor=new THREE.Color(0xf5e9ff);
const flowerPetalColorA=new THREE.Color(0xcdaaff);
const flowerPetalColorB=new THREE.Color(0x8b4df0);
function rosaXY(R){
  if(Math.random()<1/9){
    const a=Math.random()*Math.PI*2,rr=0.34*R*Math.sqrt(Math.random());
    return [Math.cos(a)*rr,Math.sin(a)*rr,true];
  }
  for(let intento=0;intento<40;intento++){
    const px=(Math.random()*2-1)*R,py=(Math.random()*2-1)*R;
    const rad=Math.sqrt(px*px+py*py);
    if(rad<=R*Math.abs(Math.cos(2.5*Math.atan2(py,px)))) return [px,py,false];
  }
  return [0,0,true];
}
for(let i=0;i<FLOWER_PARTICLES;i++){
  const [px,py,esCentro]=rosaXY(FLOWER_R);
  const rad=Math.sqrt(px*px+py*py)/FLOWER_R;
  // Cuenco: el centro se adelanta y los pétalos se echan atrás (mismo truco
  // que galaxia-placas-dia-novio), escalado a la nueva R para que la
  // profundidad relativa de la flor se vea igual de proporcionada.
  flowerPositions[i*3]=px;flowerPositions[i*3+1]=py;flowerPositions[i*3+2]=(1-rad)*5.5+(Math.random()-0.5)*4;
  const col=esCentro?flowerCenterColor:flowerPetalColorA.clone().lerp(flowerPetalColorB,Math.min(1,rad));
  flowerColors[i*3]=col.r;flowerColors[i*3+1]=col.g;flowerColors[i*3+2]=col.b;
}
// Capa de destellos: partículas chicas y muy brillantes, mismo contorno de
// rosa pero a menor radio (viven encima de los pétalos, no se salen de la
// silueta), blanco puro - es lo que de lejos se lee como "más detallada".
const SPARKLE_PARTICLES=700;
const sparklePositions=new Float32Array(SPARKLE_PARTICLES*3);
for(let i=0;i<SPARKLE_PARTICLES;i++){
  const [px,py]=rosaXY(FLOWER_R*0.92);
  sparklePositions[i*3]=px;sparklePositions[i*3+1]=py;sparklePositions[i*3+2]=6+(Math.random()-0.5)*3;
}
function makeDotTexture(size=64){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.4,'rgba(255,255,255,0.7)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const dotTex=makeDotTexture();
const flowerGeo=new THREE.BufferGeometry();
flowerGeo.setAttribute('position',new THREE.BufferAttribute(flowerPositions,3));
flowerGeo.setAttribute('color',new THREE.BufferAttribute(flowerColors,3));
const flowerMat=new THREE.PointsMaterial({size:6.4,map:dotTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,sizeAttenuation:true});
const flowerPoints=new THREE.Points(flowerGeo,flowerMat);
const sparkleGeo=new THREE.BufferGeometry();
sparkleGeo.setAttribute('position',new THREE.BufferAttribute(sparklePositions,3));
const sparkleMat=new THREE.PointsMaterial({size:3.2,map:dotTex,color:0xffffff,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true,opacity:0.9});
const sparklePoints=new THREE.Points(sparkleGeo,sparkleMat);
const flowerGroup=new THREE.Group();
flowerGroup.add(flowerPoints);
flowerGroup.add(sparklePoints);
flowerGroup.position.set(0,118,0);
scene.add(flowerGroup);
// Halo suave detras de la flor, mismo truco que el glow del nucleo, para que
// no se vea como puntos sueltos flotando sino como una flor que brilla.
// Escalado junto con la flor (R x2.17), asi el halo sigue proporcionado.
const flowerHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(512,'216,180,255','139,77,240'),transparent:true,depthWrite:false,opacity:0.55}));
flowerHalo.scale.set(260,260,1);
flowerGroup.add(flowerHalo);

// Palabras alrededor: frases del Día de las Flores Amarillas (min 1, se repiten
// ciclicamente hasta llenar las 150 posiciones que la escena ya reserva,
// sin importar cuántas haya dejado el cliente - ver schema.json).
const frasesBase=(Array.isArray(CONFIG.frases)&&CONFIG.frases.length)?CONFIG.frases:DEFAULTS.frases;
const WORD_SLOTS=150;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>frasesBase[i%frasesBase.length]);
function makeTextTexture(text,color){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  // Antes el tamaño de fuente era fijo (60px) sin importar el largo de la
  // frase - una frase larga (con emoji, que ya de por si ocupa bastante
  // ancho) se salia del lienzo de 512px y quedaba cortada a la mitad. Ahora
  // el tamaño se reduce hasta que la frase completa entra, con un piso de
  // 24px para que no se vuelva ilegible.
  const maxWidth=c.width-48;
  let fontSize=60;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>24){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=['#b388ff','#c9a4ff','#9b5de5','#a66bff','#e0c3fc','#8b4df0','#d9b8ff','#7c3aed','#be7bff','#cdaaff'];
const textGroup=new THREE.Group();scene.add(textGroup);
// Se espera a que 'Indie Flower' termine de cargar antes de dibujar las
// frases en canvas - a diferencia del texto normal del DOM (el navegador ya
// resuelve el "parpadeo" de fuente por su cuenta), un canvas dibuja con la
// fuente que este disponible EN ESE INSTANTE: sin esto, las 150 frases
// quedaban grabadas para siempre con la tipografia de respaldo (Arial) si
// la fuente todavia no habia terminado de bajar en el momento exacto en que
// corria este bucle.
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    const sp=new THREE.Sprite(mat);
    sp.scale.set(78,25,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Fotos del cliente flotando de forma individual (reemplazan a los emojis de
// la version original). Minimo 1, maximo 3 (plantilla gratuita, ver
// schema.json) - se reparten ciclicamente (i % cantidad) entre las 26
// posiciones fijas que la escena ya reserva, igual que antes hacian los
// emojis, asi que menos fotos simplemente se repiten mas seguido sin que la
// escena se vea mas vacia.
const fotosBase=(Array.isArray(CONFIG.fotos)&&CONFIG.fotos.length)?CONFIG.fotos:DEFAULTS.fotos;
function makePhotoSprite(url,size){
  const c=document.createElement('canvas');c.width=c.height=256;
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(size,size,1);
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    // La foto se dibuja ESTIRADA a todo el lienzo (cuadrado) y el sprite se
    // achica abajo a la proporcion real de la foto (aX/aY): las dos deformaciones
    // se cancelan y queda con su proporcion original. Antes se dibujaba
    // "contain" (con margenes transparentes) Y ADEMAS se achicaba el sprite: la
    // proporcion se aplicaba dos veces y una foto de 3.4:1 (un auto de perfil)
    // salia como una tira de ~11:1 (reporte real 2026-09-23: "muy aplanadas").
    ctx.drawImage(img,0,0,c.width,c.height);
    tex.needsUpdate=true;
    const aspect=img.naturalWidth/img.naturalHeight;
    const aX=Math.min(1,aspect),aY=Math.min(1,1/aspect);
    sp.scale.set(size*aX,size*aY,1);
  };
  img.onerror=()=>{};
  img.src=url;
  return sp;
}
// En movil la camara queda mas lejos y las fotos se ven chicas: un poco mas grandes ahi
// (pedido real 2026-09-23, "todos los modelos de galaxia").
const FOTO_ESCALA=(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||innerWidth<768)?1.35:1;
const photoGroup=new THREE.Group();scene.add(photoGroup);
const PHOTO_COUNT=42;
for(let i=0;i<PHOTO_COUNT;i++){
  const url=fotosBase[i%fotosBase.length];
  const size=(28+Math.random()*20)*FOTO_ESCALA;
  const sp=makePhotoSprite(url,size);
  const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
  const r=140+Math.random()*170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
  sp.userData={phi:phi,theta:theta,radius:r,speed:0.0006+Math.random()*0.0012};
  photoGroup.add(sp);
}

// ================= Controles de cámara — rotación suave, sin trabas =================
// Mismo patron que galaxia-corazon-de-flores-amarillas: target+amortiguacion (en vez
// de aplicar el giro directo al frame) para que no tiemble, inercia al soltar (sigue
// girando y frena solo) y el drag de un dedo se desactiva por completo en cuanto hay
// un segundo dedo en pantalla - antes los dos gestos (girar y pellizcar) se procesaban
// a la vez con el mismo evento touchmove y se peleaban entre si, que es lo que se
// sentia como temblor/trabas al usar dos dedos.
let isPointerDown=false,isDragging=false,startX=0,startY=0;
let targetRotX=rotX,targetRotY=rotY,velX=0,velY=0;

function onDown(e){
  isPointerDown=true;isDragging=false;velX=0;velY=0;
  const t=e.touches?e.touches[0]:e;startX=t.clientX;startY=t.clientY;
}
function onMove(e){
  if(!isPointerDown)return;
  if(e.touches&&e.touches.length>1)return;
  const t=e.touches?e.touches[0]:e;
  const dx=t.clientX-startX,dy=t.clientY-startY;
  if(Math.abs(dx)>2||Math.abs(dy)>2){
    isDragging=true;
    const sensX=(Math.PI*1.5)/innerWidth,sensY=(Math.PI*0.8)/innerHeight;
    velY=-dx*sensX;velX=dy*sensY;
    targetRotY+=velY;targetRotX=Math.max(-1.25,Math.min(1.25,targetRotX+velX));
    startX=t.clientX;startY=t.clientY;
  }
}
function onUp(){isPointerDown=false;}

const domEl=renderer.domElement;
domEl.addEventListener('mousedown',onDown);domEl.addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
domEl.addEventListener('touchstart',onDown,{passive:true});domEl.addEventListener('touchmove',onMove,{passive:true});
addEventListener('touchend',(e)=>{
  if(!e.touches||e.touches.length===0){onUp();}
  else{const t=e.touches[0];startX=t.clientX;startY=t.clientY;isDragging=false;}
},{passive:true});

addEventListener('wheel',(e)=>{targetDist+=e.deltaY*0.25;targetDist=Math.max(160,Math.min(600,targetDist));},{passive:true});

// Zoom con pellizco en móviles: listeners propios, separados del drag de un dedo.
let pinchDist=null;
function getPinchDist(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy);}
addEventListener('touchstart',(e)=>{
  if(e.touches.length===2){pinchDist=getPinchDist(e.touches);isPointerDown=false;isDragging=false;}
},{passive:true});
addEventListener('touchmove',(e)=>{
  if(e.touches.length===2){
    const newDist=getPinchDist(e.touches);
    if(pinchDist!==null){const delta=pinchDist-newDist;targetDist+=delta*0.85;targetDist=Math.max(160,Math.min(600,targetDist));}
    pinchDist=newDist;
  }else if(pinchDist!==null){
    pinchDist=null;
    if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;isPointerDown=true;isDragging=false;}
  }
},{passive:true});
addEventListener('touchend',(e)=>{if(e.touches.length<2)pinchDist=null;},{passive:true});

// Animación
let t=0;
function tick(){requestAnimationFrame(tick);t+=0.01;
  // Flor de particulas: billboard (siempre de frente a la camara) + giro propio
  // lento sobre su eje (efecto mandala) + respiracion suave de tamaño/brillo.
  flowerGroup.quaternion.copy(camera.quaternion);
  flowerPoints.rotation.z+=0.0025;
  sparklePoints.rotation.z-=0.004;
  const flowerBreath=1+0.05*Math.sin(t*0.6);
  flowerGroup.scale.set(flowerBreath,flowerBreath,1);
  flowerMat.opacity=0.85+0.15*Math.sin(t*1.3);
  sparkleMat.opacity=0.65+0.35*Math.sin(t*2.4);
  flowerHalo.material.opacity=0.45+0.15*Math.sin(t*0.6);
  ring.rotation.z+=0.003;
                // Giro lento de la segunda constelación
rotatingConstellation.rotation.z += 0.002;
rotatingConstellation.rotation.y += 0.0008;
                
  // Giro lento de las nuevas constelaciones
  constellationCrown.rotation.z += 0.0005;
  constellationDiamond.rotation.z -= 0.0007;
  constellationStar.rotation.y += 0.0008;
  constellationPath.rotation.z += 0.0004;

// Movimiento y destellos de las estrellas fugaces
shootingStars.forEach(meteor => {
    if (meteor.userData.delay > 0) {
        meteor.userData.delay--;
        return;
    }

    meteor.position.x += meteor.userData.speed;
    meteor.position.y -= meteor.userData.speed * 0.55;

    // Brillo pulsante de la estrella
    const pulse = 0.8 + Math.sin(t * 8 + meteor.position.x) * 0.2;

    meteor.userData.glow.material.opacity = pulse;
    meteor.userData.glow.scale.multiplyScalar(1.002);

    // Destello que aumenta y disminuye suavemente
    meteor.userData.flare.material.opacity =
        0.55 + Math.sin(t * 10 + meteor.position.x * 0.03) * 0.4;

    // Reiniciar cuando sale de la pantalla espacial
    if (meteor.position.x > 430 || meteor.position.y < -300) {
        meteor.position.set(
            -420 - Math.random() * 500,
            100 + Math.random() * 350,
            -180 - Math.random() * 180
        );

        meteor.userData.delay = 100 + Math.random() * 220;
    }
});


  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03),GLOW_BASE*(1+Math.sin(t*0.4)*0.03),1);
  const s=1.0+0.05*Math.sin(t*3); // latido
  core.scale.set(s,s,s);
  textGroup.children.forEach(sp=>{
    sp.material.opacity=0.8+0.2*Math.sin(t*2);
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(sp=>{
    sp.material.opacity=0.85+0.15*Math.sin(t*2+sp.userData.radius);
    // Sin rotacion propia: a diferencia de un emoji (simetrico, giraba bien
    // como si fuera un pinwheel), una foto real con forma reconocible se ve
    // rara/como "estirada" al girar sobre su propio eje en ciertos angulos -
    // se quita, la foto solo orbita y flota, se queda siempre derecha.
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  // Inercia: sin el dedo/mouse encima, la velocidad sigue empujando el giro y se va
  // frenando sola (en vez de parar en seco al soltar).
  if(!isPointerDown){
    velX*=0.88;velY*=0.88;
    targetRotX=Math.max(-1.25,Math.min(1.25,targetRotX+velX));targetRotY+=velY;
  }
  rotX+=(targetRotX-rotX)*0.12;rotY+=(targetRotY-rotY)*0.12;
  currentDist+=(targetDist-currentDist)*0.06;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();
     // ── 40 flores moradas que florecen al iniciar ──
const galaxyFlowers=document.getElementById('galaxy-flowers');

        {left:'45%', top:'84%', delay:'4s'}
    ];

    positions.forEach(pos => {

        flower.src = 'assets/flormorada4.png';

    galaxyFlowers.classList.add('visible');
}

// ── Arranque: la musica recien empieza cuando se toca la pantalla ──


// ===== TRES FLORES DE LOTO EN ORBITA 3D =====

const lotusOrbitGroup = new THREE.Group();
scene.add(lotusOrbitGroup);

const lotusLoader = new THREE.TextureLoader();

const lotusTexture = lotusLoader.load('assets/flordeloto20.gif');

function createLotus3D(x, y, z, size) {
    const material = new THREE.SpriteMaterial({
        map: lotusTexture,
        transparent: true,
        depthWrite: false
    });

    const flower = new THREE.Sprite(material);

    flower.position.set(x, y, z);
    flower.scale.set(size, size, 1);

    lotusOrbitGroup.add(flower);

    return flower;
}

// Tres flores distribuidas alrededor del planeta
const lotusFlower1 = createLotus3D(0, 105, 0, 48);
const lotusFlower2 = createLotus3D(95, -45, 25, 38);
const lotusFlower3 = createLotus3D(-85, -65, -30, 43);

// Movimiento orbital 3D
function animateLotusOrbit() {
    requestAnimationFrame(animateLotusOrbit);

    lotusOrbitGroup.rotation.y += 0.004;
    lotusOrbitGroup.rotation.z += 0.0015;

    lotusFlower1.material.rotation += 0.003;

animateLotusOrbit();
