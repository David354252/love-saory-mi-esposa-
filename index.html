<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi esposa 💜</title>
</head>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:radial-gradient(circle at center,#3b0066,#120022,#000);
    width:100vw;
    height:100vh;
    font-family:Georgia,serif;
}  
    canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
}
.texto
    animation: aparecer 3s ease;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:10;
}

.texto h1{
    font-size:60px;
    color:#d78cff;
    text-shadow:0 0 10px #b84dff, 0 0 30px #b84dff;
    margin-bottom:20px;
}

.texto p{
    font-size:24px;
    color:#f3d9ff;
    margin:10px 0;
}
    @keyframes aparecer{
    from{
        opacity:0;
        transform:translate(-50%,-40%);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}#corazones{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.corazon{
    position:absolute;
    color:#b84dff;
    font-size:24px;
    text-shadow:0 0 10px #d78cff;
    animation:flotar 8s linear infinite;
}

@keyframes flotar{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-20vh);
        opacity:0;
    }
}
    const contenedor = document.getElementById("corazones");

for(let i=0;i<30;i++){

    const corazon = document.createElement("div");

    corazon.className = "corazon";

    corazon.innerHTML = "💜";

    corazon.style.left = Math.random()*100 + "%";

    corazon.style.animationDuration = (6 + Math.random()*8) + "s";

    corazon.style.animationDelay = (Math.random()*8) + "s";

    corazon.style.fontSize = (18 + Math.random()*24) + "px";

    contenedor.appendChild(corazon);

}
</style>

}
<body>
  <canvas id="galaxia"></canvas>
    <div id="corazones"></div>
    <div class="texto">
    <h1>💜 Eres mi esposa 💜</h1>
    <p>Saory, quédate conmigo para siempre.</p>
    <p>Eres mi universo, mi paz y la razón por la que mi corazón sonríe. ✨</p>
</div>
  <script>

const canvas = document.getElementById("galaxia");
const ctx = canvas.getContext("2d");

function ajustar(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

ajustar();
window.addEventListener("resize", ajustar);
    const estrellas = [];

for(let i = 0; i < 300; i++){
    estrellas.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.5
    });
}

function dibujar(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "white";

    estrellas.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(dibujar);
}

dibujar();

</script>
  
</body>
</html>
